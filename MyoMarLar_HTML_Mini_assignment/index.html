<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sample HTML site demonstrating forms, media, tables, and semantic structure"
    />
    <meta
      name="keywords"
      content="HTML, Form, Table, Image Gallery, Video, Map"
    />

    <title>HTML Mini Assignment</title>
    <!--Open Graph Meta Tags-->
    <meta property="og:title" content="HTML Mini Assignment" />
    <meta
      property="og:description"
      content="Learn HTML structure with image gallery,tables,forms,video and map embed"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bib-mm.com/en" />
    <meta
      property="og:image"
      content="https://www.oxfordwebstudio.com/user/pages/06.da-li-znate/sta-je-html/sta-je-html.jpg"
    />
    <meta property="og:site_name" content="HTML Demo Site" />
    <!-- faviocn-->
    <link rel="icon" href="./fav.ico" type="image/x-icon" />
  </head>
  <body>
    <!-- Header  -->
    <header>
      <h1>My Sample Website</h1>
      <nav aria-label="Main navigation">
        <ul>
          <li>
            <a href="#home">Home</a>
          </li>
          <li>
            <a href="#gallery">Gallery</a>
          </li>
          <li>
            <a
              href="https://www.w3schools.com/tags/tag_thead.asp"
              target="_blank"
              rel="noopener noreferrer"
              >W3 School</a
            >
          </li>
        </ul>
      </nav>

      <hr />
    </header>

    <!-- Main  -->
    <main>
      <!-- Image Gallery Section -->
      <section>
        <h2>Image Gallery</h2>
        <img
          src="./img/cat.png"
          alt="A cat sitting indoors"
          width="350"
          height="500"
          loading="lazy"
        />
        <img
          src="./img/sunflower.jpg"
          alt="A yellow sunflower in bloom"
          width="350"
          height="500"
          loading="lazy"
        />
        <img
          src="./img/tulips.jpg"
          alt="Colorful tulips in bloom"
          width="350"
          height="500"
          loading="lazy"
        />
      </section>
      <hr />
      <!-- Table Layout Section  -->
      <section>
        <h2>Table Layout</h2>
        <table border="1">
          <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
              <th>Country</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Alice</td>
              <td>Developer</td>
              <td>Japan</td>
            </tr>
            <tr>
              <td>Bob</td>
              <td>Designer</td>
              <td>Myanmar</td>
            </tr>
          </tbody>
        </table>
      </section>
      <hr />
      <!-- Video Section  -->
      <section>
        <h2>Video</h2>
        <video width="350" height="200" controls>
          <source src="./video/sample.mp4#t=3" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </section>
      <hr />
      <!-- Map Embed Section  -->
      <section>
        <h2>Map Embed</h2>
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15277.910968648932!2d96.23048716780548!3d16.80263943057809!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x30c1ed5bb3fa0411%3A0x9d0ef03318e66ea7!2sNational%20Races%20Village!5e0!3m2!1sen!2smm!4v1792131729793!5m2!1sen!2smm"
          title="Map showing National Races Village"
          width="600"
          height="450"
          style="border: 0"
          allowfullscreen
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </section>
      <hr />
      <!-- Contact Form Section  -->
      <section>
        <form action="#" method="post" enctype="multipart/form-data">
          <h2>Contact Form</h2>
          <!-- UserName  -->
          <label for="userName">Name:</label>
          <input
            type="text"
            id="userName"
            placeholder="Enter your name"
            name="userName"
            required
          />
          <br />
          <br />
          <!-- Email  -->
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required
          />
          <br /><br />
          <!-- Password  -->
          <label for="password">Password:</label>
          <input
            type="password"
            id="password"
            name="password"
            minlength="6"
            maxlength="11"
            required
          /><br /><br />

          <!-- Subscribe  -->
          <input type="checkbox" id="subscribe" name="subscribe" />
          <label for="subscribe">Subscribe to newsletter</label> <br /><br />

          <!-- Gender  -->
          <input type="radio" id="male" name="gender" value="male" />
          <label for="male">Male</label>

          <input type="radio" id="female" name="gender" value="female" />
          <label for="female">Female</label> <br /><br />

          <!-- Upload File  -->
          <label for="file">Upload File:</label>
          <input type="file" id="file" name="file" /> <br /><br />

          <!-- Select Country  -->
          <label for="selectCountry">Select Country:</label>
          <select class="form-select" name="selectCountry" id="selectCountry">
            <option value="" disabled selected>---Select Country---</option>
            <option value="mm">Myanmar</option>
            <option value="th">Thailand</option>
            <option value="sg">Singapore</option>
            <option value="jp">Japan</option>
          </select>
          <br /><br />

          <!-- Message box  -->
          <label for="message">Message:</label> <br />
          <textarea
            name="message"
            id="message"
            rows="5"
            cols="30"
            placeholder="Write your message here..."
            required
          ></textarea
          ><br /><br />

          <!-- Button  -->
          <button type="submit">Submit</button>
          <button type="reset">Reset</button>
        </form>
      </section>
      <hr />
    </main>

    <!-- Footer  -->
    <footer>
      <h2>Follow Us</h2>
      <ul>
        <li>
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Facebook page (opens in a new tab)"
            >Facebook</a
          >
        </li>
        <li><a href="tel:+959956626392">09 956626392</a></li>
        <li>
          <a href="mailto:marlar.mmlk@gmail.com">marlar.mmlk@gmail.com</a>
        </li>
      </ul>
    </footer>
  </body>
</html>
